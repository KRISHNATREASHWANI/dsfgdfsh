<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Vault — File Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="scene">
    <p class="scene-label">The Vault</p>

    <div class="orbit">
      <svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
        <rect x="24" y="40" width="72" height="52" rx="4" fill="none" stroke="#d4a24c" stroke-width="2.5"/>
        <path d="M24 40 L24 30 Q24 26 28 26 L46 26 L54 36 L92 36 Q96 36 96 40" fill="none" stroke="#d4a24c" stroke-width="2.5" stroke-linejoin="round"/>
        <line x1="38" y1="58" x2="82" y2="58" stroke="#8891a8" stroke-width="2"/>
        <line x1="38" y1="70" x2="82" y2="70" stroke="#8891a8" stroke-width="2"/>
        <line x1="38" y1="82" x2="64" y2="82" stroke="#8891a8" stroke-width="2"/>
      </svg>

      <button class="node node--n" data-action="create">
        <span class="node-icon">＋</span>
        <span class="node-label">Create</span>
      </button>
      <button class="node node--e" data-action="read">
        <span class="node-icon">◎</span>
        <span class="node-label">Read</span>
      </button>
      <button class="node node--s" data-action="update">
        <span class="node-icon">✎</span>
        <span class="node-label">Update</span>
      </button>
      <button class="node node--w" data-action="delete">
        <span class="node-icon">✕</span>
        <span class="node-label">Delete</span>
      </button>
    </div>

    <p class="scene-caption">Choose an entry to open a ledger action.</p>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <aside class="log" id="log">
    <p class="log-title">Ledger entries</p>
    <div class="log-list" id="logList">
      <p class="log-empty">No actions recorded yet.</p>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
